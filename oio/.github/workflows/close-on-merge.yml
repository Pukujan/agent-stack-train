name: OIO close on merge

# Reusable close contract. A caller passes the OIO ref that supplies the
# script; this workflow only runs for a merged pull request, closes the issues
# named by native closing verbs, and syncs the log's lifecycle status.
#
# The `github` context in a called workflow belongs to the caller's event, so
# `github.event.pull_request.merged` is the merged flag of the pull request
# that triggered the caller. The same guard is repeated in the same-repo
# caller so an unmerged close never reaches this workflow.

on:
  workflow_call:
    inputs:
      oio_ref:
        description: Git ref of Pukujan/observational-issue-ops that supplies oio_close_refs.py.
        required: true
        type: string
    secrets:
      CROSS_REPO_TOKEN:
        description: Token with issues write on referenced repositories. Falls back to github.token.
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out OIO at the caller-pinned ref
        uses: actions/checkout@v4
        with:
          repository: Pukujan/observational-issue-ops
          ref: ${{ inputs.oio_ref }}
          path: .oio-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Close referenced issues and sync lifecycle status
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
        run: |
          python .oio-src/.github/scripts/oio_close_refs.py \
            --apply \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.html_url }}"
