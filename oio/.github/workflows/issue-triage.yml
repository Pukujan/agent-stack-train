name: Issue Triage

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  triage:
    name: Triage Issue Log Entry
    runs-on: ubuntu-latest
    steps:
      - name: Triage issue type, filer stamp, plane, and priority
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            // Check if this is an issue-log entry
            const isIssueLog =
              issue.labels.some(l => l.name === 'observational-issue') ||
              body.includes('Contributor Plane') ||
              body.includes('Observational Plane') ||
              body.includes('Filer Origin');

            if (!isIssueLog) {
              console.log('Not an issue-log entry. Skipping triage.');
              return;
            }

            const labelsToAdd = new Set();
            labelsToAdd.add('observational-issue');
            labelsToAdd.add('proposal');

            // 0. Issue type -> type:<value> label
            const TYPE_VALUES = ['observational', 'operational', 'proposal', 'incident'];
            const typeMatch = body.match(/###\s*Issue Type\s*\n+([^\n#]+)/i);
            let issueType = null;
            if (typeMatch) {
              const found = TYPE_VALUES.find(t => typeMatch[1].trim().toLowerCase().startsWith(t));
              if (found) issueType = found;
            }
            if (issueType) {
              labelsToAdd.add(`type:${issueType}`);
            } else {
              labelsToAdd.add('needs-issue-type');
            }

            // 0b. Filer stamp -> filer:<origin> label, validated
            const ORIGIN_VALUES = ['human-direct', 'human-via-agent', 'agent-initiated'];
            const originMatch = body.match(/###\s*Filer Origin[^\n]*\n+([^\n#]+)/i);
            let filerOrigin = null;
            if (originMatch) {
              const found = ORIGIN_VALUES.find(o => originMatch[1].trim().toLowerCase().startsWith(o));
              if (found) filerOrigin = found;
            }
            // The identity/session field must be present and non-trivial for the stamp to count
            const identityMatch = body.match(/###\s*Filer Identity[^\n]*\n+([^\n#]+)/i);
            const identity = identityMatch ? identityMatch[1].trim() : '';
            const hasIdentity = identity.length >= 8 && !/^\s*_No response_\s*$/i.test(identity);

            if (filerOrigin && hasIdentity) {
              labelsToAdd.add(`filer:${filerOrigin}`);
            } else {
              // Fail closed: an unstamped or identity-less filing is visibly flagged for the owner.
              labelsToAdd.add('needs-filer-stamp');
            }

            // 1. Detect Plane from plane section
            let plane = null;
            const planeSectionMatch = body.match(/(?:###\s*(?:Contributor|Observational)\s*Plane|Plane:?)[^\n]*\n+([^\n#]+)/i);
            const planeTarget = planeSectionMatch ? planeSectionMatch[1] : '';

            if (
              planeTarget.includes('Plane 1') ||
              planeTarget.includes('Lead Owner') ||
              (!planeSectionMatch && (body.includes('plane:lead-owner') || body.includes('Plane 1:')))
            ) {
              plane = 1;
              labelsToAdd.add('plane:lead-owner');
            } else if (
              planeTarget.includes('Plane 2') ||
              planeTarget.includes('Collaborator') ||
              (!planeSectionMatch && (body.includes('plane:collaborator') || body.includes('Plane 2:')))
            ) {
              plane = 2;
              labelsToAdd.add('plane:collaborator');
            } else if (
              planeTarget.includes('Plane 3') ||
              planeTarget.includes('Community') ||
              (!planeSectionMatch && (body.includes('plane:community') || body.includes('Plane 3:')))
            ) {
              plane = 3;
              labelsToAdd.add('plane:community');
            } else {
              // Fallback heuristic if section header not found
              if (body.match(/\b(?:Plane\s*1|Lead Owner)\b/i)) {
                plane = 1;
                labelsToAdd.add('plane:lead-owner');
              } else if (body.match(/\b(?:Plane\s*2|Collaborator)\b/i)) {
                plane = 2;
                labelsToAdd.add('plane:collaborator');
              } else if (body.match(/\b(?:Plane\s*3|Community)\b/i)) {
                plane = 3;
                labelsToAdd.add('plane:community');
              }
            }

            // 2. Parse Priority Rating (1-100)
            const prioritySectionMatch = body.match(/(?:###\s*Priority\s*Rating[^\n]*|Priority Rating[^\n:]*:?)\s*\n*([^\n#]+)/i);
            let pVal = null;

            if (prioritySectionMatch) {
              const numMatch = prioritySectionMatch[1].match(/\b([1-9][0-9]?|100)\b/);
              if (numMatch) {
                pVal = parseInt(numMatch[1], 10);
              }
            }

            if (pVal === null) {
              const explicitMatch = body.match(/\b(?:priority:p|Priority\s*P|P)([1-9][0-9]?|100)\b/i);
              if (explicitMatch) {
                pVal = parseInt(explicitMatch[1], 10);
              }
            }

            if (pVal !== null) {
              // Clamp or validate based on plane rubric
              if (plane === 1) {
                pVal = Math.max(1, Math.min(20, pVal));
              } else if (plane === 2) {
                pVal = Math.max(20, Math.min(40, pVal));
              } else if (plane === 3) {
                pVal = Math.max(40, Math.min(100, pVal));
              } else {
                pVal = Math.max(1, Math.min(100, pVal));
              }
              labelsToAdd.add(`priority:p${pVal}`);
            }

            // 3. Apply labels
            const targetLabels = Array.from(labelsToAdd);
            console.log(`Adding labels to issue #${issue.number}:`, targetLabels);

            // Ensure labels exist before adding
            for (const name of targetLabels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch (e) {
                // Label does not exist, create it
                const color = name.startsWith('plane:lead-owner') ? 'd93f0b' :
                              name.startsWith('plane:collaborator') ? '0075ca' :
                              name.startsWith('plane:community') ? '0e8a16' :
                              name.startsWith('priority:p') ? 'b60205' :
                              name.startsWith('type:observational') ? '1d76db' :
                              name.startsWith('type:operational') ? 'd93f0b' :
                              name.startsWith('type:proposal') ? '6f42c1' :
                              name.startsWith('type:incident') ? 'b60205' :
                              name.startsWith('filer:human-direct') ? '0e8a16' :
                              name.startsWith('filer:human-via-agent') ? '0075ca' :
                              name.startsWith('filer:agent-initiated') ? '5319e7' :
                              name === 'needs-filer-stamp' ? 'fbca04' :
                              name === 'needs-issue-type' ? 'fbca04' : '6f42c1';
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color,
                    description: `Automated label for ${name}`,
                  });
                } catch (createErr) {
                  console.log(`Note: could not create label ${name}:`, createErr.message);
                }
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: targetLabels,
            });
