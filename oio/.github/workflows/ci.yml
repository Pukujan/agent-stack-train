name: ci

# Required status check for PCM-governed merges into main.
# Reproducible machine gates: continuity validate + preflight and the CGM
# adapter check at the commits in stack-mesh.json, no committed secrets,
# and parse of the issue templates and workflows OIO publishes.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # OIO's installer must run on Windows too: ACS SPEC.md section 6 requires every
  # installer to run on Windows, macOS, and Linux, and the Windows path is only
  # reachable on a real Windows host. `gates` aggregates this job so the required
  # context stays `gates` while the platform boundary is enforced, not assumed.
  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the installer and triage suite on Windows
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

  gates:
    name: gates
    needs: [windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the mesh continuity CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml
          PCM=$(python -c "import json; print(json.load(open('stack-mesh.json',encoding='utf-8'))['requires']['project-continuity-modules']['commit'])")
          python -m pip install "git+https://github.com/Pukujan/project-continuity-modules.git@${PCM}"
          continuity --version

      - name: Continuity validate
        run: continuity validate --root .

      - name: Continuity preflight (TARGET_VALID)
        run: continuity preflight --root .

      - name: Install OIO schema validator and run the installer/triage regression suite
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Validate the content adapter against the mesh helper
        run: |
          CGM=$(python -c "import json; print(json.load(open('stack-mesh.json',encoding='utf-8'))['requires']['content-generation-modules']['commit'])")
          git clone --quiet https://github.com/Pukujan/content-generation-modules.git /tmp/cgm
          git -C /tmp/cgm checkout --quiet "${CGM}"
          python /tmp/cgm/scripts/validate_content_system.py \
            --root /tmp/cgm \
            --adapter .content-system \
            --project-root .
          # CGM 0.5.12 runs the product-only README check automatically when a
          # README is present; its CLI has no --check-adopter-readme flag.

      - name: No committed secrets (tracked tree)
        run: |
          if git grep -nIE 'sk-or-[A-Za-z0-9]|yolo_[A-Za-z0-9]{4,}|api[_-]?key["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9]{20}'; then
            echo "FAIL: tracked secret-like string found"
            exit 1
          fi
          echo "OK: no committed secrets"

      - name: Stack manifest agrees with the certified release train
        run: |
          git clone --quiet https://github.com/Pukujan/agent-stack-train.git /tmp/train
          python /tmp/train/scripts/check_manifest.py \
            --manifest stack-manifest.json \
            --train /tmp/train/stack-releases.json

      - name: Issue templates and workflows parse
        run: |
          python - <<'PY'
          import glob, yaml
          files = sorted(glob.glob(".github/ISSUE_TEMPLATE/*.yml")) + sorted(glob.glob(".github/workflows/*.yml"))
          for f in files:
              with open(f, encoding="utf-8") as fh:
                  yaml.safe_load(fh)
              print("OK", f)
          print(f"OK: {len(files)} file(s) parse")
          PY

      - name: Require the Windows installer suite green
        run: |
          set -euo pipefail
          echo "windows=${{ needs.windows.result }}"
          test "${{ needs.windows.result }}" = "success"
