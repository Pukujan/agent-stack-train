name: Lifecycle status drift audit

# Same-repo caller for the reusable drift audit. The scheduled run checks the
# default branch every day; a manual dispatch runs the same check on demand.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  drift:
    uses: ./.github/workflows/oio-status-drift.yml
    with:
      oio_ref: ${{ github.event.repository.default_branch }}
    secrets:
      CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
