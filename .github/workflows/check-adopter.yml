name: Check adopter manifest

# Reusable: call this from an adopter's CI so no repository copies the check.
#
#   jobs:
#     stack-train:
#       uses: Pukujan/agent-stack-train/.github/workflows/check-adopter.yml@main
#       with:
#         manifest: stack-manifest.json
#
# A private repository that runs its jobs on its own runners passes them as
# JSON, for example `runs_on: '["self-hosted","org-pool"]'`.

on:
  workflow_call:
    inputs:
      manifest:
        description: Repository-relative path to the adopter's stack-manifest.json
        required: false
        type: string
        default: stack-manifest.json
      train-ref:
        description: Train revision to check against
        required: false
        type: string
        default: main
      claude:
        description: 'Whether the adopter must carry the Claude Code bridge and guard: CLAUDE.md importing AGENTS.md, and the hooks in .claude/settings.json that enforce the rules. "warn" (the default) annotates the run, "require" fails it.'
        required: false
        type: string
        default: warn
      runs_on:
        description: 'Runner for the job, as JSON: "ubuntu-latest" (the default) or a label list such as ["self-hosted","org-pool"].'
        required: false
        type: string
        default: '"ubuntu-latest"'

permissions:
  contents: read

jobs:
  check:
    name: Manifest agrees with the release train
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - name: Check out the adopter
        uses: actions/checkout@v4

      - name: Check out the train
        uses: actions/checkout@v4
        with:
          repository: Pukujan/agent-stack-train
          ref: ${{ inputs.train-ref }}
          path: .stack-train

      # Use the runner's own Python 3.10+ when it has one. setup-python cannot
      # install on a self-hosted Mac: its macOS package writes to
      # /Users/runner and runs `sudo installer`.
      - name: Find Python on the runner
        id: python
        shell: bash
        run: |
          if command -v python3 >/dev/null && python3 -c 'import sys; sys.exit(sys.version_info < (3, 10))'; then
            mkdir -p "$RUNNER_TEMP/python-bin"
            ln -sf "$(command -v python3)" "$RUNNER_TEMP/python-bin/python"
            echo "$RUNNER_TEMP/python-bin" >> "$GITHUB_PATH"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.python.outputs.found != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the manifest against the certified train
        run: |
          python .stack-train/scripts/check_manifest.py \
            --manifest "${{ inputs.manifest }}" \
            --train .stack-train/stack-releases.json \
            --installed .oio/install-manifest.json

      # Claude Code reads CLAUDE.md, not AGENTS.md. Without the import, Claude
      # sessions in the adopter run with none of the stack's rules.
      - name: Claude Code loads AGENTS.md
        run: |
          python .stack-train/acs/modules/coordination/multi-agent-hotload/v0.1.0/scripts/claude_bridge.py \
            --adopter-root . ${{ inputs.claude != 'require' && '--warn-only' || '' }}

      # Every task starts from an issue log, so a pull request must name the
      # issue it comes from (#37). Callers that want edits to the body rechecked
      # add `edited` to their pull_request types.
      - name: Pull request names its owning issue
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python .stack-train/oio/.github/scripts/oio_close_refs.py --require-link \
            --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/pr-body.md"
