name: Require the mesh

# The four stack repositories call this. It fails when that repository
# requires an older version than stack-releases.json. With write=true it
# opens a pull request that moves the repository onto the mesh.

on:
  workflow_call:
    inputs:
      component:
        description: Which of the four repositories is calling
        required: true
        type: string
      write:
        description: Open a pull request that rewrites stack-mesh.json to the mesh
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  mesh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v4

      - name: Check out the mesh
        uses: actions/checkout@v4
        with:
          repository: Pukujan/agent-stack-train
          ref: main
          path: .stack-train

      - name: Require every sibling at the mesh version
        if: ${{ !inputs.write }}
        run: python .stack-train/scripts/mesh.py --check --root . --component "${{ inputs.component }}"

      - name: Rewrite the local requirement to the mesh
        if: ${{ inputs.write }}
        run: python .stack-train/scripts/mesh.py --write --root . --component "${{ inputs.component }}"

      - name: Open a pull request when this repository was behind
        if: ${{ inputs.write }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B mesh/sync
          git add -- stack-mesh.json
          if [ -f .github/workflows/ci.yml ]; then
            git add -- .github/workflows/ci.yml
          fi
          if git diff --cached --quiet; then
            echo "Already on the mesh."
            exit 0
          fi
          git commit -m "Require the current mesh versions of the sibling stack repositories."
          # actions/checkout fetches only the default branch, so when mesh/sync
          # already exists on the remote there is no remote-tracking ref for it
          # here. --force-with-lease fails closed on that unknown ref ("stale
          # info"), which rejected every push once the branch existed. Fetch it
          # first so the lease has a value; tolerate it being absent.
          git fetch origin mesh/sync || true
          git push --force-with-lease origin mesh/sync
          gh pr create --base main --head mesh/sync --title "Require the current mesh versions" --body "A sibling stack component moved. This repository has to require that version. An older checkout stays failed." || echo "pull request already open"
          # Arm auto-merge so the repair lands on its own once the required
          # checks pass. Opening the PR without this left every mesh repair
          # sitting unmerged, which is how a stale pin survived for weeks.
          gh pr merge mesh/sync --auto --squash --delete-branch || echo "auto-merge not armed; checks may still be pending"
