name: Auto-merge

# Arms squash auto-merge on every non-draft pull request into main from a
# branch of this repository (#69), so it merges once `gates` passes with no
# one remembering to arm it. Pull requests from forks are skipped.
#
# Only trusted authors get it (#91): the repository's admins (the owner, and
# the owner's agents, which act as the owner) and logins listed in the
# repository variable AUTO_MERGE_AUTHORS (comma-separated). Anyone else's pull
# request waits for the owner's review, and a push by an untrusted account
# turns auto-merge off again.
#
# It needs the secret STACK_UPGRADE_TOKEN, a personal token with the `repo`
# scope. A merge armed with this workflow's own token closes nothing and
# starts no close-on-merge run (see close-sweep.yml); one armed with a
# personal token is attributed to a user, so close-on-merge-caller.yml runs.
# Without the secret it only warns.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  arm:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Arm squash auto-merge for a trusted author
        env:
          GH_TOKEN: ${{ secrets.STACK_UPGRADE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PUSHER: ${{ github.actor }}
          TRUSTED: ${{ vars.AUTO_MERGE_AUTHORS }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning title=No auto-merge token::STACK_UPGRADE_TOKEN is not set, so auto-merge was not armed on #$PR."
            exit 0
          fi
          trusted() {
            printf '%s\n' "$TRUSTED" | tr ', ' '\n\n' | grep -qixF -- "$1" && return 0
            [ "$(gh api "repos/$REPO/collaborators/$1/permission" --jq .permission 2>/dev/null)" = admin ]
          }
          armed=$(gh pr view "$PR" -R "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')
          for who in "$AUTHOR" "$PUSHER"; do
            if ! trusted "$who"; then
              echo "::notice title=Not armed::#$PR involves $who, who is not trusted to merge without review; the owner reviews it."
              if [ "$armed" = "true" ]; then
                gh pr merge "$PR" -R "$REPO" --disable-auto
                echo "Turned auto-merge off on #$PR."
              fi
              exit 0
            fi
          done
          if [ "$armed" = "true" ]; then
            echo "Auto-merge is already armed on #$PR."
            exit 0
          fi
          gh pr merge "$PR" -R "$REPO" --auto --squash
          echo "Armed squash auto-merge on #$PR."
