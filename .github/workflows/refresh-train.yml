name: Refresh the release train

on:
  schedule:
    # Hourly. GitHub may delay scheduled runs; workflow_dispatch is the manual catch-up.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read each component's default branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_train.py
      - name: Commit when a component head moved
        run: |
          if git diff --quiet -- stack-releases.json; then
            echo "Train already matches the default branches."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stack-releases.json
          git commit -m "Refresh the release train to the latest component commits."
          git push
