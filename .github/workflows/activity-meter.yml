name: Activity meter

# Counts the issues, pull requests and comments each adopter created in the
# last week and puts the table in this run's summary, so a return to opening a
# pull request at every stop or commenting after every push shows up (#108).
# It only reads: it files nothing and comments nowhere. It uses
# STACK_UPGRADE_TOKEN when set, to read private adopters; otherwise this
# workflow's own token, which sees only public ones.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: Window in days
        required: false
        type: string
        default: "7"

permissions:
  contents: read

jobs:
  meter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Count GitHub writes per adopter
        env:
          GH_TOKEN: ${{ secrets.STACK_UPGRADE_TOKEN || github.token }}
          DAYS: ${{ inputs.days || '7' }}
        run: python scripts/activity_meter.py --days "$DAYS" | tee -a "$GITHUB_STEP_SUMMARY"
