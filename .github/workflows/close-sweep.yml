name: OIO close sweep

# Reusable scheduled sweep. A merge carried out with the workflow token (for
# example auto-merge armed by a bot) closes nothing and starts no close-on-merge
# run, so this reads the recent merged pull requests into the default branch
# and settles the open logs they name with a closing verb. It also labels (or
# closes) open parents whose sub-issues are all closed. With `apply: false`,
# the default, it only prints what it would do.

on:
  workflow_call:
    inputs:
      oio_ref:
        description: Git ref of Pukujan/agent-stack-train that supplies oio/.github/scripts/oio_close_refs.py.
        required: true
        type: string
      apply:
        description: Close and label issues. When false, only report what would change.
        required: false
        type: boolean
        default: false
      rollup:
        description: For an open parent whose sub-issues are all closed, `label` it oio:ready-to-close or `close` it.
        required: false
        type: string
        default: label
      runs_on:
        description: 'Runner for the job, as JSON: "ubuntu-latest" (the default) or a label list such as ["self-hosted","org-pool"].'
        required: false
        type: string
        default: '"ubuntu-latest"'
    secrets:
      CROSS_REPO_TOKEN:
        description: Token with issues write on referenced repositories. Falls back to github.token.
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sweep:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - name: Check out OIO's scripts at the caller-pinned stack ref
        uses: actions/checkout@v4
        with:
          repository: Pukujan/agent-stack-train
          ref: ${{ inputs.oio_ref }}
          path: .oio-src
          sparse-checkout: oio/.github/scripts

      # Use the runner's own Python 3.10+ when it has one. setup-python cannot
      # install on a self-hosted Mac: its macOS package writes to
      # /Users/runner and runs `sudo installer`.
      - name: Find Python on the runner
        id: python
        shell: bash
        run: |
          if command -v python3 >/dev/null && python3 -c 'import sys; sys.exit(sys.version_info < (3, 10))'; then
            mkdir -p "$RUNNER_TEMP/python-bin"
            ln -sf "$(command -v python3)" "$RUNNER_TEMP/python-bin/python"
            echo "$RUNNER_TEMP/python-bin" >> "$GITHUB_PATH"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.python.outputs.found != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Settle issues that merges left open, and roll up finished parents
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          APPLY: ${{ inputs.apply }}
          ROLLUP: ${{ inputs.rollup }}
        run: |
          args=(--sweep --repo "$REPO" --rollup "$ROLLUP")
          if [ "$APPLY" = "true" ]; then
            args+=(--write)
          fi
          python .oio-src/oio/.github/scripts/oio_close_refs.py "${args[@]}"
