name: OIO status drift

# OIO owns the drift check; this caller only supplies the schedule. The called
# workflow is pinned to a commit SHA, not a branch, so the contract PCM relies
# on cannot move underneath it.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  drift:
    uses: Pukujan/observational-issue-ops/.github/workflows/oio-status-drift.yml@305adc5d09920d28e603a1b317108637cc30a624
    with:
      oio_ref: 305adc5d09920d28e603a1b317108637cc30a624
    secrets:
      CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
