name: Close observational issue on merge

# OIO owns the close-on-merge contract; this caller only grants the event and
# scopes. The called workflow is pinned to a commit SHA, not a branch, so the
# contract PCM relies on cannot move underneath it.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close:
    if: github.event.pull_request.merged == true
    uses: Pukujan/observational-issue-ops/.github/workflows/close-on-merge.yml@ff4e30cf5c89442290544d61e376462a83d88f76
    with:
      oio_ref: ff4e30cf5c89442290544d61e376462a83d88f76
    secrets:
      CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
