name: Content system checks

on:
  push:
    branches:
      - main
      - "task/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate contract
        run: python scripts/validate_content_system.py --root .
      - name: Run tests
        run: python -m unittest discover -s tests -v
